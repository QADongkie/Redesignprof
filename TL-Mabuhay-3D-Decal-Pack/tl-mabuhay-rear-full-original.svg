<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="880" viewBox="0 0 1600 880">
  <title>TL Mabuhay Hiace rear student driver decal</title>
  <desc>Transparent automotive-vinyl artwork with the official TL Mabuhay seal and a high-visibility caution student driver message.</desc>

  <!-- The canvas intentionally has no background. Only the two safety bands are opaque vinyl. -->
  <g id="brand-lockup">
    <image href="tl-mabuhay-round-logo.png" xlink:href="tl-mabuhay-round-logo.png" x="58" y="34" width="272" height="272" preserveAspectRatio="xMidYMid meet" />

    <text x="366" y="126" fill="#071a31" font-family="Arial, Helvetica, sans-serif" font-size="98" font-weight="900" letter-spacing="1">TL MABUHAY</text>
    <text x="371" y="190" fill="#071a31" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="800" letter-spacing="1.3">DRIVING LESSON ACADEMY, INC.</text>
    <rect x="370" y="216" width="1136" height="14" rx="7" fill="#f3b61f" />
    <text x="372" y="282" fill="#ae1f34" font-family="Arial, Helvetica, sans-serif" font-size="42" font-style="italic" font-weight="800" letter-spacing="1.5">YOUR DEFENSIVE DRIVING ADVOCATE</text>
  </g>

  <g id="safety-message">
    <rect x="58" y="338" width="1484" height="226" rx="26" fill="#b41f34" stroke="#f3b61f" stroke-width="14" />
    <text x="800" y="520" fill="#ffffff" stroke="#071a31" stroke-width="13" paint-order="stroke fill" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="184" font-weight="900" text-anchor="middle" letter-spacing="9">CAUTION</text>

    <rect x="58" y="590" width="1484" height="226" rx="26" fill="#071a31" stroke="#f3b61f" stroke-width="14" />
    <text x="800" y="752" fill="#ffffff" stroke="#b41f34" stroke-width="11" paint-order="stroke fill" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="119" font-weight="900" text-anchor="middle" letter-spacing="4">STUDENT DRIVER</text>
  </g>
</svg>
