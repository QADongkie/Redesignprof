<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  width="1600" height="900" viewBox="0 0 1600 900" role="img"
  aria-labelledby="hero-title hero-description">
  <title id="hero-title">TL Mabuhay Driving Lesson Academy, Inc.</title>
  <desc id="hero-description">Layered cinematic driving academy hero scene designed for web animation.</desc>
  <defs>
    <linearGradient id="vignette" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00152a" stop-opacity=".86"/>
      <stop offset=".40" stop-color="#00152a" stop-opacity=".28"/>
      <stop offset=".73" stop-color="#00152a" stop-opacity="0"/>
      <stop offset="1" stop-color="#00152a" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="bottom-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".55" stop-color="#001020" stop-opacity="0"/>
      <stop offset="1" stop-color="#001020" stop-opacity=".60"/>
    </linearGradient>
    <radialGradient id="sun-halo">
      <stop offset="0" stop-color="#fffbe2" stop-opacity=".72"/>
      <stop offset=".32" stop-color="#ffc400" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffc400" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc400" stop-opacity="0"/>
      <stop offset=".35" stop-color="#ffc400"/>
      <stop offset="1" stop-color="#fff2b0" stop-opacity=".05"/>
    </linearGradient>
    <filter id="car-shadow" x="-25%" y="-30%" width="150%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#000b16" flood-opacity=".60"/>
    </filter>
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="text-shadow" x="-20%" y="-30%" width="150%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#00101e" flood-opacity=".58"/>
    </filter>
    <clipPath id="frame"><rect width="1600" height="900" rx="0"/></clipPath>
  </defs>

  <g id="frame" clip-path="url(#frame)">
    <g id="background-parallax">
      <image id="background-image" x="-22" y="-14" width="1644" height="926"
        preserveAspectRatio="xMidYMid slice" href="tl-mabuhay-background.png"/>
    </g>

    <circle id="sun-halo-layer" cx="1305" cy="281" r="205" fill="url(#sun-halo)"/>
    <circle id="sun-ring" cx="1305" cy="281" r="112" fill="none" stroke="#fff2ad"
      stroke-width="2" stroke-opacity=".46"/>

    <g id="atmosphere-layer" opacity=".70">
      <path d="M793 690C1005 619 1195 535 1350 393" fill="none" stroke="#ffc400"
        stroke-width="2" stroke-opacity=".35" stroke-dasharray="12 30"/>
      <path d="M465 872C856 743 1108 593 1386 403" fill="none" stroke="#fff4be"
        stroke-width="3" stroke-opacity=".23" stroke-dasharray="18 42"/>
      <path d="M126 900C630 773 1005 622 1376 402" fill="none" stroke="#ffc400"
        stroke-width="2" stroke-opacity=".20" stroke-dasharray="8 34"/>
    </g>

    <rect width="1600" height="900" fill="url(#vignette)" pointer-events="none"/>
    <rect width="1600" height="900" fill="url(#bottom-shade)" pointer-events="none"/>

    <g id="copy-layer" filter="url(#text-shadow)">
      <a href="https://tlmabuhay.com/" target="_blank" aria-label="Visit TL Mabuhay Driving Lesson Academy">
        <g id="copy-eyebrow">
          <path d="M100 198H143" stroke="#ffc400" stroke-width="3"/>
          <text x="160" y="204" fill="#ffc400" font-family="Arial,Helvetica,sans-serif"
            font-size="16" font-weight="800" letter-spacing="3.4">YOUR DEFENSIVE DRIVING ADVOCATE</text>
        </g>
        <text id="copy-title" x="96" y="318" fill="#fff8e9"
          font-family="Impact,'Arial Narrow',Arial,sans-serif" font-size="105"
          font-weight="900" letter-spacing="1">TL MABUHAY</text>
        <text id="copy-subtitle" x="102" y="368" fill="#ffffff"
          font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700"
          letter-spacing="5.4">DRIVING LESSON ACADEMY, INC.</text>
      </a>
      <path id="copy-accent" d="M101 400H456" stroke="url(#gold-line)" stroke-width="3"/>
    </g>

    <g id="car-scroll-layer">
      <g id="car-parallax-layer">
        <g id="car-arrival-layer" filter="url(#car-shadow)">
          <ellipse id="car-contact-shadow" cx="1002" cy="796" rx="330" ry="46"
            fill="#000914" opacity=".43" filter="url(#soft-glow)"/>
          <image id="car-image" x="580" y="405" width="790" height="413"
            preserveAspectRatio="xMidYMid meet" href="tl-mabuhay-car.png"/>
          <ellipse id="tail-light-glow" cx="742" cy="624" rx="115" ry="31"
            fill="#ff2a12" opacity=".18" filter="url(#soft-glow)"/>
        </g>
      </g>
    </g>

    <g id="route-tag" transform="translate(1372 815)">
      <circle r="5" fill="#ffc400"/>
      <text x="15" y="5" fill="#fff" font-family="Arial,Helvetica,sans-serif"
        font-size="11" font-weight="800" letter-spacing="2">READY TO DRIVE</text>
    </g>
  </g>
</svg>
