<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nissan Sentra Hood Decal Verification Tool</title>
  <style>
    body { margin: 0; background: #070d18; color: #fff; font-family: sans-serif; overflow: hidden; }
    #container { width: 1280px; height: 800px; margin: 0 auto; position: relative; }
    #status { position: absolute; top: 16px; left: 16px; background: rgba(0,0,0,0.85); padding: 12px 20px; border-radius: 8px; font-weight: bold; color: #ffd000; z-index: 100; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="container">
    <div id="status">Initializing 3D Pipeline...</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const container = document.getElementById('container');
    const statusEl = document.getElementById('status');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x060f1d);

    const camera = new THREE.PerspectiveCamera(38, 1280 / 800, 0.1, 100);
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(1280, 800);
    renderer.setPixelRatio(window.devicePixelRatio || 1);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.4);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xfffaed, 2.8);
    keyLight.position.set(-5, 8, 6);
    keyLight.castShadow = true;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x7fb2ff, 1.8);
    fillLight.position.set(6, 4, 5);
    scene.add(fillLight);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 30),
      new THREE.MeshStandardMaterial({ color: 0x040913, roughness: 0.8, metalness: 0.2 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.01;
    ground.receiveShadow = true;
    scene.add(ground);

    function refineNissanHoodDecal(root) {
      const decal = root.getObjectByName("TL_MABUHAY_HOOD_DECAL");
      if (!(decal instanceof THREE.Mesh)) return;

      const geometry = decal.geometry.clone();
      geometry.computeBoundingBox();
      const bounds = geometry.boundingBox;
      const position = geometry.getAttribute("position");
      if (bounds && position) {
        const center = new THREE.Vector3();
        bounds.getCenter(center);
        const scaleFactor = 0.72; // Proportional clean hood logo scale (~40cm)
        const slope = -0.2084;
        for (let i = 0; i < position.count; i++) {
          const origX = position.getX(i);
          const origY = position.getY(i);
          const origZ = position.getZ(i);

          const x = center.x + (origX - center.x) * scaleFactor;
          const z = center.z + (origZ - center.z) * scaleFactor;
          const dz = z - origZ;
          const y = origY + dz * slope + 0.00004;

          position.setXYZ(i, x, y, z);
        }
        position.needsUpdate = true;
        geometry.computeVertexNormals();
        geometry.computeBoundingBox();
        geometry.computeBoundingSphere();
        decal.geometry = geometry;
      }

      const sourceMaterial = Array.isArray(decal.material) ? decal.material[0] : decal.material;
      const sourceMap =
        sourceMaterial instanceof THREE.MeshBasicMaterial || sourceMaterial instanceof THREE.MeshStandardMaterial
          ? sourceMaterial.map
          : null;
      decal.material = new THREE.MeshStandardMaterial({
        name: "TL_MABUHAY_AUTOMOTIVE_HOOD_VINYL",
        map: sourceMap,
        color: 0xffffff,
        transparent: true,
        opacity: 0.96,
        alphaTest: 0.05,
        depthWrite: false,
        roughness: 0.35,
        metalness: 0.05,
        side: THREE.FrontSide,
        polygonOffset: true,
        polygonOffsetFactor: -3,
        polygonOffsetUnits: -3,
      });
      decal.renderOrder = 4;
    }

    const loader = new GLTFLoader();
    const gltf = await loader.loadAsync('/assets/2007-nissan-sentra-tl-mabuhay-hood-decal.glb');
    const model = gltf.scene;

    refineNissanHoodDecal(model);

    model.traverse((child) => {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
        const name = (child.material?.name || '').toLowerCase();

        if (name.includes('nissansentra') && !/glass|plast|wheel|luz|int|decal/.test(name)) {
          child.material = new THREE.MeshPhysicalMaterial({
            name: "NISSANsentra_Body_Navy",
            color: new THREE.Color(0x0e2759),
            metalness: 0.86,
            roughness: 0.20,
            clearcoat: 1.0,
            clearcoatRoughness: 0.10,
            reflectivity: 0.90,
          });
        }
      }
    });

    const box = new THREE.Box3().setFromObject(model);
    const size = new THREE.Vector3();
    box.getSize(size);
    const scale = 4.15 / Math.max(size.x, size.z);
    model.scale.setScalar(scale);

    const scaledBox = new THREE.Box3().setFromObject(model);
    const scaledCenter = new THREE.Vector3();
    scaledBox.getCenter(scaledCenter);
    model.position.x = -scaledCenter.x;
    model.position.z = -scaledCenter.z;
    model.position.y = -scaledBox.min.y + 0.015;
    model.updateMatrixWorld(true);

    scene.add(model);

    // Front-Hood Perspective Camera
    camera.position.set(-1.8, 1.6, 2.8);
    camera.lookAt(new THREE.Vector3(0, 0.75, 1.2));
    camera.updateProjectionMatrix();

    renderer.render(scene, camera);

    const dataUrl = renderer.domElement.toDataURL('image/png');
    await fetch(`/save-view/view_hood_scaled_preview`, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: dataUrl
    });

    statusEl.innerText = "ALL_DONE: Hood Decal Rendered Successfully!";
    console.log("ALL_DONE");
  </script>
</body>
</html>
